replicaCount: 1

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

nameOverride: ""
fullnameOverride: ""

# API group of the webhook. Must match spec.acme.solvers[].dns01.webhook.groupName
# in the Issuer/ClusterIssuer.
groupName: de.su541.acme

image:
  repository: ghcr.io/su541/cert-manager-desec-webhook
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Names of the secrets (in the release namespace) holding deSEC API tokens.
# The webhook may only read these secrets.
secretName:
  - desec-io-token

# Port the webhook listens on inside the container. The image runs as a
# non-root user, so this must be above 1024.
containerPort: 8443

service:
  port: 443
  type: ClusterIP

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
